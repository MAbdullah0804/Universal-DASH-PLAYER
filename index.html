<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar mynav navbar-expand-lg" data-aos="fade-down" data-aos-duration="800" data-aos-mirror="true">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">DASH PLAYER</a>
    <button class="navbar-toggler togl-btn" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="blogpg/blog.html">Blog Page</a>
        </li>
      </ul>
      <form class="d-flex">
        <a class="join nav-link" href="login-register/login.html">Join</a>
      </form>
    </div>
  </div>
</nav>
<div class="container-fluid bg-secondary">
    <div class="row text-center">
        <div class="col-12">
      <div data-aos="fade-left" data-aos-duration="800" data-aos-mirror="true">
    <h2 class="text-dark">Universal DASH / HLS / MP4 Player</h2>
    </div>
        </div>
    </div>
    <div class="row text-center">
        <div class="col-12">
            <div data-aos="fade-right" data-aos-duration="800" data-aos-mirror="true">
    <input id="streamURL" type="text" placeholder="Paste .mpd, .m3u8, or MP4 URL here..." required>
            </div>
        </div>
    </div>
    <div class="row text-center">
        <div class="col-12">
                <div data-aos="flip-right" data-aos-duration="800" data-aos-mirror="true">
    <button type="submit" onclick="loadVideo()" class="play-btn">Play Stream</button>
    </div>
        </div>
    </div>
    <div class="row d-flex justify-content-center">
        <div class="col-10">
            <div data-aos="zoom-in" data-aos-duration="800" data-aos-mirror="true">
        <video id="videoPlayer" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" 
            data-setup="{}">
        </video>
        </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
                <div data-aos="zoom-out-right" data-aos-duration="800">
    <h2>Play Local Video File (MP4 / WebM / MKV)</h2>
      </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
                <div data-aos="zoom-out-left" data-aos-duration="800">      
<input id="streamFile" class="local-input" type="file" accept="video/*" required>
</div>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <button onclick="loadLocalVideo()" class="play-btn">Play Video</button>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>
</html>
