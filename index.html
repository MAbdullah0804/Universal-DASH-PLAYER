<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Stream Player</title>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
</head>

<body>
    <header>
      <div data-aos="fade-down">
  <nav class="navbar mynav navbar-expand-lg" >
  <div class="container-fluid">
    <a class="navbar-brand me-2rem text-dark" href="#">DASH PLAYER</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item text-dark">
          <a class="nav-link active text-dark" aria-current="page" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark" aria-current="page" href="blogpg/blog.html" target="_blank">Blogs</a>
        </li>
      </ul>
      <form class="d-flex">
        <a class="join nav-link text-dark" href="login-register/login.html" target="_blank">Join</a>
      </form>
    </div>
  </div>
</nav>
</div>
</header>
<main>
    <div class="container-fluid">
      <div data-aos="fade-left">
    <h2 class="text-dark">Universal DASH / HLS / MP4 Player</h2>
    </div>
    <div data-aos="fade-right">
    <input id="streamURL" type="text" placeholder="Paste .mpd, .m3u8, or MP4 URL here..." required>
    </div>
    <br>
    <div data-aos="flip-right">
    <button type="submit" onclick="loadVideo()" class="play-btn">Play Stream</button>
    </div>
        <div class="row justify-content-center">
            <div class="col-11 ">
          <div data-aos="zoom-in">
        <video id="videoPlayer" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" 
            data-setup="{}">
        </video>
        </div>
        </div>
    </div>
    <div data-aos="zoom-out-right">
    <h2>Play Local Video File (MP4 / WebM / MKV)</h2>
      </div>
    <div data-aos="zoom-out-left">      
<input id="streamFile" class="local-input" type="file" accept="video/*" required>
</div>
<br><br>
<button onclick="loadLocalVideo()" class="play-btn">Play Video</button>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<!-- Video.js -->
<script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>
    <script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>

    <!-- DASH support (dash.js + videojs-dash) -->
    <script src="https://cdn.jsdelivr.net/npm/dashjs@4/dist/dash.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-contrib-dash@latest/dist/videojs-dash.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
  AOS.init();
</script>
    <script src="script.js"></script>
  </body>

</html>
